name: Vektur Vortex signed build and TestFlight upload

# Manual only. No P12 and no Mac needed: Xcode signs with an App Store Connect API key and
# Apple-managed ("cloud") distribution signing (-allowProvisioningUpdates). The IPA is uploaded straight to
# App Store Connect/TestFlight by xcodebuild and is NEVER stored as a workflow artifact (public repo).
#
# Required repository SECRETS (create in GitHub Settings -> Secrets and variables -> Actions; never paste them in chat):
#   ASC_KEY_ID      Key ID of the App Store Connect API key
#   ASC_ISSUER_ID   Issuer ID (UUID) shown on the App Store Connect Keys page
#   ASC_KEY_P8      full text of the downloaded AuthKey_XXXX.p8 file
# Optional repository VARIABLE: APPLE_TEAM_ID (defaults to the Team ID in your Apple Distribution certificate).
on:
  workflow_dispatch:
  push:                       # fires ONLY when the trigger file changes (also registers the workflow, which a dispatch-only file on a non-default branch is not)
    branches: [recovery/reconstruct-directory-structure]
    paths: [.github/testflight-trigger.txt]

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27      # GitHub runner image with macOS 27, Xcode 27 and the iOS 27 SDK (GA since 2026-10-15)
    timeout-minutes: 75
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID || 'H4358J7N36' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/reconstruct-directory-structure

      - name: Select Xcode 27 and require the iOS 27 or later SDK
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi 'beta\|candidate' | sort -V | tail -1 || true)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] || { echo "::error::No Xcode 27 found on this runner image"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          [ "${SDK%%.*}" -ge 27 ] || { echo "::error::iOS SDK $SDK is older than 27"; exit 1; }

      - name: Check secrets are present (names only, values never printed)
        env:
          K: ${{ secrets.ASC2_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          I: ${{ secrets.ASC2_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P: ${{ secrets.ASC2_KEY_P8 || secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          bad=0
          [ -n "$K" ] || { echo "::error::ASC_KEY_ID / APP_STORE_CONNECT_KEY_ID is missing or empty"; bad=1; }
          [ -n "$I" ] || { echo "::error::ASC_ISSUER_ID / APP_STORE_CONNECT_ISSUER_ID is missing or empty"; bad=1; }
          [ -n "$P" ] || { echo "::error::ASC_KEY_P8 / APP_STORE_CONNECT_PRIVATE_KEY is missing or empty"; bad=1; }
          exit $bad

      - name: Test the API key against Apple (prints HTTP status and Apple's error title only)
        env:
          ASC_KEY_ID: ${{ secrets.ASC2_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          HAS_ASC2: ${{ secrets.ASC2_KEY_ID != '' && secrets.ASC2_ISSUER_ID != '' && secrets.ASC2_KEY_P8 != '' }}
          ASC_ISSUER_ID: ${{ secrets.ASC2_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC2_KEY_P8 || secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          pip3 install -q --break-system-packages pyjwt cryptography 2>&1 | tail -1 || pip3 install -q pyjwt cryptography
          python3 - <<'PY'
          import os, re, time, json, base64, urllib.request, urllib.error
          import jwt
          kid = re.sub(r"\s", "", os.environ["ASC_KEY_ID"]); kid = re.sub(r"^AuthKey_|\.p8$", "", kid); iss = re.sub(r"\s", "", os.environ["ASC_ISSUER_ID"])
          pem = os.environ["ASC_KEY_P8"]
          if "BEGIN PRIVATE KEY" not in pem:
              pem = base64.b64decode(pem).decode()
          print("Using ASC2_* secrets:", os.environ.get("HAS_ASC2"), "| Key ID (not secret):", kid, "| P8 has BEGIN/END:", "BEGIN PRIVATE KEY" in pem and "END PRIVATE KEY" in pem, "| P8 lines:", len(pem.strip().splitlines()))
          print("Key ID equals ST4KYU5J85:", kid == "ST4KYU5J85", "| Key ID equals 3NJN8V7UDQ (Vektur Drum):", kid == "3NJN8V7UDQ", "| Issuer equals expected:", iss.lower() == "56df11ce-03e3-4db6-8e1d-2ab6e4bf9c34")
          print("Key ID length:", len(kid), "(Apple Key IDs are 10 characters)")
          print("Issuer ID looks like a UUID:", bool(re.fullmatch(r"[0-9a-fA-F-]{36}", iss)))
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, pem, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=50&fields[apps]=bundleId", headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req, timeout=30); d = json.load(r)
              ids = [a["attributes"]["bundleId"] for a in d.get("data", [])]
              print("HTTP", r.status, "- API key accepted by Apple. Apps visible:", ids)
              print("App record for com.dreammusictemple.vectavortex exists:", "com.dreammusictemple.vectavortex" in ids)
          except urllib.error.HTTPError as e:
              body = json.loads(e.read().decode() or "{}")
              print("HTTP", e.code, [(x.get("code"), x.get("title"), x.get("detail")) for x in body.get("errors", [])])
              raise SystemExit("::error::Apple rejected the API key (see status above)")
          PY

      - name: Install XcodeGen and generate project
        run: brew install xcodegen && cd Apple && xcodegen generate

      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC2_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC2_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC2_KEY_P8 || secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_KEY_ID="${ASC_KEY_ID#AuthKey_}"; ASC_KEY_ID="${ASC_KEY_ID%.p8}"      # tolerate a Key ID saved as the file name
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          KEYFILE="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$ASC_KEY_P8" > "$KEYFILE" ;;
            *) printf '%s' "$ASC_KEY_P8" | base64 -d > "$KEYFILE" ;;   # accept a base64-encoded .p8 as well
          esac
          grep -q "BEGIN PRIVATE KEY" "$KEYFILE" || { echo "::error::API key secret is not a valid .p8 (neither PEM nor base64 PEM)"; exit 1; }
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          PLIST

          set -o pipefail
          xcodebuild -project Apple/VectaVortex.xcodeproj -scheme VectaVortex -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tail -n 40
          # The archive is unsigned on purpose (same as the proven validation archive): a Development profile would need a
          # registered device and TestFlight needs none. exportArchive then signs with the Apple-managed Distribution certificate.

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}" 2>&1 | tail -n 60

      - name: Remove API key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
