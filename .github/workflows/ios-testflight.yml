name: Vektur Vortex signed build and TestFlight upload

# Manual only. No P12 and no Mac needed: Xcode signs with an App Store Connect API key and
# Apple-managed ("cloud") distribution signing (-allowProvisioningUpdates). The IPA is uploaded straight to
# App Store Connect/TestFlight by xcodebuild and is NEVER stored as a workflow artifact (public repo).
#
# Required repository SECRETS (create in GitHub Settings -> Secrets and variables -> Actions; never paste them in chat):
#   ASC_KEY_ID      Key ID of the App Store Connect API key
#   ASC_ISSUER_ID   Issuer ID (UUID) shown on the App Store Connect Keys page
#   ASC_KEY_P8      full text of the downloaded AuthKey_XXXX.p8 file
# Optional repository VARIABLE: APPLE_TEAM_ID (defaults to the Team ID in your Apple Distribution certificate).
on:
  workflow_dispatch:
  push:                       # fires ONLY when the trigger file changes (also registers the workflow, which a dispatch-only file on a non-default branch is not)
    branches: [recovery/reconstruct-directory-structure]
    paths: [.github/testflight-trigger.txt]

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID || 'H4358J7N36' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/reconstruct-directory-structure

      - name: Select newest Xcode (Apple requires a current SDK for uploads)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; else echo "::warning::No Xcode 26 on this runner image; upload may be rejected for an old SDK."; fi
          xcodebuild -version

      - name: Check secrets are present (names only, values never printed)
        env:
          K: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          bad=0
          [ -n "$K" ] || { echo "::error::ASC_KEY_ID / APP_STORE_CONNECT_KEY_ID is missing or empty"; bad=1; }
          [ -n "$I" ] || { echo "::error::ASC_ISSUER_ID / APP_STORE_CONNECT_ISSUER_ID is missing or empty"; bad=1; }
          [ -n "$P" ] || { echo "::error::ASC_KEY_P8 / APP_STORE_CONNECT_PRIVATE_KEY is missing or empty"; bad=1; }
          exit $bad

      - name: Install XcodeGen and generate project
        run: brew install xcodegen && cd Apple && xcodegen generate

      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$ASC_KEY_P8" > "$KEYFILE" ;;
            *) printf '%s' "$ASC_KEY_P8" | base64 -d > "$KEYFILE" ;;   # accept a base64-encoded .p8 as well
          esac
          grep -q "BEGIN PRIVATE KEY" "$KEYFILE" || { echo "::error::API key secret is not a valid .p8 (neither PEM nor base64 PEM)"; exit 1; }
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          set -o pipefail
          xcodebuild -project Apple/VectaVortex.xcodeproj -scheme VectaVortex -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive 2>&1 | tail -n 60

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}" 2>&1 | tail -n 60

      - name: Remove API key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
