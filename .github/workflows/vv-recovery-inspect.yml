name: Vektur Vortex recovery and iOS simulator build
on:
  push:
    branches:
      - recovery/reconstruct-directory-structure
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-and-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/reconstruct-directory-structure
          fetch-depth: 0
      - name: Retrieve manifest archives from main without changing main
        run: |
          git fetch origin main --depth=1
          git show origin/main:VECTUR_VORTEX_MANIFEST.zip > /tmp/VECTUR_VORTEX_MANIFEST.zip
          git show origin/main:VekturVortex_GitHub_Recovery_Files.zip > /tmp/VekturVortex_GitHub_Recovery_Files.zip
      - name: Restore only SHA-1-verified original paths
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, os, shutil, zipfile
          manifest_zip = "/tmp/VECTUR_VORTEX_MANIFEST.zip"
          recovery_zip = "/tmp/VekturVortex_GitHub_Recovery_Files.zip"
          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def file_sha(path):
              with open(path, "rb") as f: return blob_sha(f.read())
          with zipfile.ZipFile(manifest_zip) as mz:
              mapping_name = next(n for n in mz.namelist() if n.endswith("VECTUR_VORTEX_GITHUB_PATH_MAPPING.csv"))
              manifest_name = next(n for n in mz.namelist() if n.endswith("VECTUR_VORTEX_FILE_MANIFEST.csv"))
              mappings = list(csv.DictReader(io.TextIOWrapper(mz.open(mapping_name), encoding="utf-8-sig")))
              manifest = {r["original_relative_path"]: r["git_blob_sha1"] for r in csv.DictReader(io.TextIOWrapper(mz.open(manifest_name), encoding="utf-8-sig"))}
          moved=0; already=0; skipped=0; conflicts=[]
          for row in mappings:
              src=(row.get("current_github_path") or "").strip()
              dst=(row.get("correct_original_path") or "").strip()
              expected=(row.get("git_blob_sha1") or "").strip()
              identical=(row.get("exists_in_github_identical_content") or "").strip().lower()=="yes"
              if not src or not dst or src==dst or not identical:
                  skipped += 1; continue
              if not os.path.isfile(src) or file_sha(src)!=expected:
                  skipped += 1; continue
              os.makedirs(os.path.dirname(dst) or ".", exist_ok=True)
              if os.path.exists(dst):
                  if os.path.isfile(dst) and file_sha(dst)==expected:
                      os.remove(src); already += 1
                  else:
                      conflicts.append((src,dst,"destination exists with different content"))
                  continue
              shutil.move(src,dst); moved += 1
          added=0
          with zipfile.ZipFile(recovery_zip) as rz:
              for name in rz.namelist():
                  if name.endswith("/"): continue
                  data=rz.read(name)
                  expected=manifest.get(name)
                  if not expected or blob_sha(data)!=expected:
                      raise SystemExit("Recovery ZIP SHA-1 verification failed: "+name)
                  os.makedirs(os.path.dirname(name) or ".", exist_ok=True)
                  if os.path.exists(name):
                      if os.path.isfile(name) and file_sha(name)==expected:
                          already += 1; continue
                      conflicts.append((name,name,"destination exists with different content"))
                      continue
                  with open(name,"wb") as f: f.write(data)
                  added += 1
          print(f"Verified flat-root moves: {moved}")
          print(f"Already restored identically: {already}")
          print(f"Recovery ZIP files added: {added}")
          print(f"Skipped non-identical/unmapped entries: {skipped}")
          print(f"Conflicts: {len(conflicts)}")
          for c in conflicts[:100]: print("CONFLICT:", *c)
          if conflicts:
              raise SystemExit("Refusing to overwrite conflicting files; see conflict list above")
          if not os.path.isdir("Core/include") or not os.path.isdir("Bridge") or not os.path.isdir("Assets"):
              raise SystemExit("Required original project directories are still missing after verified restore")
          PY
      - name: Split multi-property SwiftUI wrappers for Swift compiler compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patches = {
            "Apple/Shared/AuthoringTools.swift": [
              ("    @State private var stMode = 0, stQuality = 1; @State private var stValue = 1.0", "    @State private var stMode = 0\n    @State private var stQuality = 1\n    @State private var stValue = 1.0"),
              ("    @State private var spEngine = 0, spScale = 0, spWindow = 0", "    @State private var spEngine = 0\n    @State private var spScale = 0\n    @State private var spWindow = 0"),
              ("    @State private var arm = true, loadIntoSlot = true", "    @State private var arm = true\n    @State private var loadIntoSlot = true"),
              ("    @State private var status = \"\", elapsed = 0.0, level: Float = 0", "    @State private var status = \"\"\n    @State private var elapsed = 0.0\n    @State private var level: Float = 0"),
              ("    @State private var image: CGImage?, imageName = \"\"", "    @State private var image: CGImage?\n    @State private var imageName = \"\""),
              ("    @State private var rgb = false, invert = false, loop = true", "    @State private var rgb = false\n    @State private var invert = false\n    @State private var loop = true"),
              ("    @State private var duration = 6.0, tilt = 0.4, gamma = 1.2", "    @State private var duration = 6.0\n    @State private var tilt = 0.4\n    @State private var gamma = 1.2"),
              ("    @State private var note = 36, harmonics = 96", "    @State private var note = 36\n    @State private var harmonics = 96"),
            ],
            "Apple/Shared/ClipLauncherView.swift": [
              ("    @Published var bank = 0, selected = 0, quant = 5, mode = 0", "    @Published var bank = 0\n    @Published var selected = 0\n    @Published var quant = 5\n    @Published var mode = 0"),
              ("    @Published var playing: UInt64 = 0, queuedStart: UInt64 = 0, queuedStop: UInt64 = 0", "    @Published var playing: UInt64 = 0\n    @Published var queuedStart: UInt64 = 0\n    @Published var queuedStop: UInt64 = 0"),
            ],
            "Apple/Shared/Controls.swift": [
              ("    @State private var dragT: Double = 0, lastTy: CGFloat = 0, lastTx: CGFloat = 0", "    @State private var dragT: Double = 0\n    @State private var lastTy: CGFloat = 0\n    @State private var lastTx: CGFloat = 0"),
            ],
            "Apple/Shared/CurveEditorView.swift": [
              ("    @State private var snap = false, fine = false", "    @State private var snap = false\n    @State private var fine = false"),
              ("    @State private var zoom: Double = 1, x0: Double = 0", "    @State private var zoom: Double = 1\n    @State private var x0: Double = 0"),
            ],
            "Apple/Shared/DawRecorderView.swift": [
              ("    @State private var recording = false, busy = false, showSettings = false", "    @State private var recording = false\n    @State private var busy = false\n    @State private var showSettings = false"),
            ],
            "Apple/Shared/IRReverbView.swift": [
              ("    @State private var importing = false, replacing = false, confirmRemove = false, showAdvanced = false", "    @State private var importing = false\n    @State private var replacing = false\n    @State private var confirmRemove = false\n    @State private var showAdvanced = false"),
            ],
            "Apple/Shared/ModView.swift": [
              ("    @State private var x = 0.5, y = 0.5", "    @State private var x = 0.5\n    @State private var y = 0.5"),
              ("    @State private var layer = \"WT\", xDest = \"cutoff\", yDest = \"reso\"", "    @State private var layer = \"WT\"\n    @State private var xDest = \"cutoff\"\n    @State private var yDest = \"reso\""),
            ],
            "Apple/Shared/PitchEnvelopeView.swift": [
              ("    @State private var lastPhase: Double = 0, lastSeen: TimeInterval = 0, shown: Double = 0", "    @State private var lastPhase: Double = 0\n    @State private var lastSeen: TimeInterval = 0\n    @State private var shown: Double = 0"),
            ],
            "Apple/Shared/SampleWaveformEditor.swift": [
              ("    @State private var vs = 0.0, ve = 1.0", "    @State private var vs = 0.0\n    @State private var ve = 1.0"),
            ],
            "Apple/Shared/SoundView.swift": [
              ("    @State private var showTools = false, showRecord = false, showImageAudio = false", "    @State private var showTools = false\n    @State private var showRecord = false\n    @State private var showImageAudio = false"),
            ],
          }
          for name, replacements in patches.items():
              p = Path(name)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected declaration not found: {name}: {old}")
                  text = text.replace(old, new, 1)
              p.write_text(text)
              print("Patched", name, len(replacements), "declarations")
          PY
      - name: Commit restored project paths to recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore Vektur Vortex original project directory structure"
            git push origin HEAD:recovery/reconstruct-directory-structure
          else
            echo "No repository changes were needed."
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: Apple
        run: xcodegen generate
      - name: Build iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Apple/VectaVortex.xcodeproj -scheme VectaVortex -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/vektur-vortex-xcodebuild.log
      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vektur-vortex-xcodebuild-log
          path: /tmp/vektur-vortex-xcodebuild.log
          if-no-files-found: ignore
