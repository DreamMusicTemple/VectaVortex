name: Create Apple Distribution P12

# Manual only. Runs on ubuntu (macos-14 is not a supported runner configuration for this repo).
#
# SECURITY: this repository is PUBLIC, so every workflow artifact is downloadable by any signed-in GitHub user.
# The P12 is therefore NEVER uploaded in the clear. It is encrypted with `age` to the owner's PUBLIC key
# (repository variable P12_AGE_RECIPIENT, value starts "age1"). Only the matching private key, which stays
# on the owner's Mac, can decrypt it, so the artifact is useless to anyone else. The P12 is additionally
# password-protected. If P12_AGE_RECIPIENT is missing/invalid the job fails before any P12 is made.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # download the key artifact from an earlier run

concurrency:
  group: create-distribution-p12-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  create-p12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The CSR workflow ran on several pushes, so several different encrypted keys exist.
      # Exactly the key whose public key matches distribution.cer produces an encrypted P12; the others report "no match" and upload nothing.
      matrix:
        key_run: [45994080217, 45996680423, 45996513190]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            distribution.cer
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check recipient public key is configured (fail closed)
        env:
          RCPT: ${{ vars.P12_AGE_RECIPIENT }}
        run: |
          case "$RCPT" in age1[0-9a-z]*) echo "Recipient public key present.";; *) echo "::error::Repository variable P12_AGE_RECIPIENT (public key starting age1) is not set. Nothing was created."; exit 1;; esac

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Download encrypted key artifact (run ${{ matrix.key_run }})
        uses: actions/download-artifact@v4
        with:
          name: Vektur-Vortex-Apple-Distribution-CSR-and-encrypted-key
          run-id: ${{ matrix.key_run }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: key-in

      - name: Verify match, build P12, encrypt to owner public key
        id: build
        env:
          KEY_PASS: ${{ secrets.CSR_KEY_PASSWORD }}
          P12_PASS: ${{ secrets.P12_PASSWORD || secrets.CSR_KEY_PASSWORD }}
          RCPT: ${{ vars.P12_AGE_RECIPIENT }}
        run: |
          set -uo pipefail
          [ -n "$KEY_PASS" ] || { echo "::error::CSR_KEY_PASSWORD secret is missing"; exit 1; }
          KEYFILE="$(find key-in -name 'VekturVortex_AppleDistribution_private_key.pem' | head -1)"
          test -s "$KEYFILE" && test -s distribution.cer || { echo "::error::key or certificate file missing"; exit 1; }
          bash .github/scripts/package-p12.sh distribution.cer "$KEYFILE" out "$RCPT"
          rc=$?
          if [ $rc -eq 4 ]; then
            echo "::notice::Key from run ${{ matrix.key_run }} does NOT match distribution.cer. Nothing uploaded for this key."
            echo "matched=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ $rc -eq 0 ] || exit $rc
          echo "matched=true" >> "$GITHUB_OUTPUT"

      - name: Upload ENCRYPTED P12 (.age) - unreadable without the owner's private key
        if: steps.build.outputs.matched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vektur-Vortex-Distribution-P12
          path: out/VekturVortex_Distribution.p12.age
          retention-days: 1
          if-no-files-found: error

      - name: Remove working files
        if: always()
        run: rm -rf key-in out

  require-one-match:
    needs: create-p12
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless exactly one key produced the encrypted P12
        uses: actions/download-artifact@v4
        with:
          name: Vektur-Vortex-Distribution-P12
          path: check
      - run: test "$(ls check | wc -l)" -eq 1 && ls check | grep -q '\.age$' && echo "Encrypted P12 artifact present."
