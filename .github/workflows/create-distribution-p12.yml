name: Create Apple Distribution P12

# Manual only. (The old push trigger re-ran this on every push; and macos-14 is not a supported
# runner configuration for this repository, which is why every attempt was cancelled with
# "The configuration 'macos-14-arm64-us-default' is not supported". openssl on ubuntu is enough.)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # needed to download an artifact that belongs to a different run

concurrency:
  group: create-distribution-p12-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  create-p12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The CSR workflow ran on several pushes, so several different encrypted keys exist.
      # Only the one whose public key matches distribution.cer succeeds; the others stop at the match check.
      matrix:
        key_run: [45994080217, 45996680423, 45996513190]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            distribution.cer
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download encrypted key artifact (run ${{ matrix.key_run }})
        uses: actions/download-artifact@v4
        with:
          name: Vektur-Vortex-Apple-Distribution-CSR-and-encrypted-key
          run-id: ${{ matrix.key_run }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: key-in

      - name: Verify certificate/key match, export and verify password-protected P12
        env:
          KEY_PASS: ${{ secrets.CSR_KEY_PASSWORD }}
          P12_PASS: ${{ secrets.P12_PASSWORD || secrets.CSR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEY_PASS" ] || { echo "CSR_KEY_PASSWORD secret is missing"; exit 1; }
          [ -n "${{ secrets.P12_PASSWORD }}" ] || echo "::warning::P12_PASSWORD secret not set; reusing CSR_KEY_PASSWORD for the P12. Set a separate P12_PASSWORD for better protection."
          KEYFILE="$(find key-in -name 'VekturVortex_AppleDistribution_private_key.pem' | head -1)"
          test -s "$KEYFILE" && test -s distribution.cer
          mkdir out
          bash .github/scripts/make-p12.sh distribution.cer "$KEYFILE" out/VekturVortex_Distribution.p12

      - name: Upload P12 artifact (password protected, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: Vektur-Vortex-Distribution-P12
          path: out/VekturVortex_Distribution.p12
          retention-days: 1
          if-no-files-found: error
